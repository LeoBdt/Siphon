# Deployment for a single host.
#
# Only the proxy publishes a port. The browser talks to one origin, which is
# why nothing about the host has to be known when the images are built.
#
# Settings worth knowing (all optional, put them in a .env file next to this):
#   SIPHON_PORT  port published on the host            (default 8080)
#   SIPHON_BIND  address to bind to, e.g. 127.0.0.1     (default 0.0.0.0)
#   DATA_DIR     where downloads and the database live (default ./data)
#
# The containers run as uid 1000, so the data directory must be writable by it:
#   mkdir -p data && sudo chown -R 1000:1000 data

services:
  api:
    # Published by CI, for linux/amd64 and linux/arm64.
    #
    # No `build:` here on purpose. With one, a pull that fails for any reason —
    # a missing architecture, a network hiccup — makes Compose quietly try to
    # build instead, and the error you get is about a source tree you never
    # downloaded rather than about the pull. Building from source is opt-in,
    # through docker-compose.build.yml.
    image: ghcr.io/leobdt/siphon-api:latest
    restart: unless-stopped
    environment:
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
      # WEB_ORIGIN is deliberately left at its restrictive default. Behind the
      # proxy every request is same-origin, so no CORS check ever runs — a
      # permissive value would buy nothing and widen the surface of an app that
      # has no authentication yet. Set it only if you serve the web app from a
      # different origin than the API.
    volumes:
      # Downloads, scratch space and the SQLite database, on the host so they
      # survive the container and can be backed up like ordinary files.
      - ${DATA_DIR:-./data}:/data
    expose:
      - "3001"

  web:
    image: ghcr.io/leobdt/siphon-web:latest
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"

  proxy:
    # Carries its own routing config, so this compose file needs nothing else
    # from the repository — downloading it on its own is enough to deploy.
    image: ghcr.io/leobdt/siphon-proxy:latest
    restart: unless-stopped
    ports:
      - "${SIPHON_BIND:-0.0.0.0}:${SIPHON_PORT:-8080}:80"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

volumes:
  caddy-data:
  caddy-config:
