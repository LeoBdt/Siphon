name: Publish images

# Builds the three images and pushes them to GitHub's registry, so deploying is
# a pull instead of a multi-minute compile on the target machine — which matters
# on a small server, where building is slow and memory-hungry.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Rebuilt nightly even without a commit: the images would otherwise keep
  # whatever base, ffmpeg and yt-dlp were current the day they were built, and
  # yt-dlp in particular stops working when a platform changes something.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Publishing is automatic, so it must not be blind: a nightly rebuild picking
  # up a broken upstream change would otherwise ship it straight to everyone.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: proxy
            dockerfile: deploy/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/<owner>/siphon-api, ghcr.io/<owner>/siphon-web
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/siphon-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache kept in the registry: a rebuild only redoes what changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A tag alone does not make a release, and the in-app update check asks
  # GitHub for the latest *release*. Without this, pushing a tag built the
  # images and left the check reporting that nothing had ever been published.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the notes are generated from the commits since the
          # previous tag, and a shallow clone has none of them.
          fetch-depth: 0
      # Notes written from the commits, not --generate-notes: that lists merged
      # pull requests, and work lands here by pushing straight to main — so it
      # produced a release whose entire body was a compare link.
      #
      # Each commit contributes its subject as a heading and its body beneath,
      # because a subject alone cannot say everything a version changed. Commit
      # messages are the release notes here; they are written for whoever is
      # deciding whether to pull the new images.
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          {
            if [ -n "$previous" ]; then
              echo "## Changes since ${previous}"
              echo
              # --reverse: oldest first, so the notes read in the order the
              # work happened rather than backwards.
              git log --no-merges --reverse --format='### %s%n%n%b' \
                "${previous}..${GITHUB_REF_NAME}"
              echo "**Full changelog**: https://github.com/${REPO}/compare/${previous}...${GITHUB_REF_NAME}"
            else
              # First release: everything there is.
              echo "## Changes"
              echo
              git log --no-merges --reverse --format='### %s%n%n%b' "${GITHUB_REF_NAME}"
            fi
          } > "${RUNNER_TEMP}/notes.md"

          # Idempotent, so re-running this job repairs a release rather than
          # failing on one that already exists.
          # --latest and --prerelease=false are not decoration: a release left
          # marked as a pre-release is excluded from /releases/latest, which
          # answers 404 — and the in-app check then reports, accurately and
          # uselessly, that nothing has ever been published.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "Siphon ${GITHUB_REF_NAME#v}" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --prerelease=false \
              --latest
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "Siphon ${GITHUB_REF_NAME#v}" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --latest \
              --verify-tag
          fi
