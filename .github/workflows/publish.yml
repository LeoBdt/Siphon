name: Publish images

# Builds the three images and pushes them to GitHub's registry, so deploying is
# a pull instead of a multi-minute compile on the target machine — which matters
# on a small server, where building is slow and memory-hungry.

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Rebuilt nightly even without a commit: the images would otherwise keep
  # whatever base, ffmpeg and yt-dlp were current the day they were built, and
  # yt-dlp in particular stops working when a platform changes something.
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  # Publishing is automatic, so it must not be blind: a nightly rebuild picking
  # up a broken upstream change would otherwise ship it straight to everyone.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: apps/api/Dockerfile
          - name: web
            dockerfile: apps/web/Dockerfile
          - name: proxy
            dockerfile: deploy/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # ghcr.io/<owner>/siphon-api, ghcr.io/<owner>/siphon-web
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/siphon-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layer cache kept in the registry: a rebuild only redoes what changed.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # A tag alone does not make a release, and the in-app update check asks
  # GitHub for the latest *release*. Without this, pushing a tag built the
  # images and left the check reporting that nothing had ever been published.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the notes are generated from the commits since the
          # previous tag, and a shallow clone has none of them.
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Siphon ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
